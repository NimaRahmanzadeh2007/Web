<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather App</title>
    <link rel="stylesheet" href="style.css">

</head>

<body>

    <div id="container">

        <div class="title">
            <h2>Weather App 🌦️</h2>
        </div>

        <div class="con">
            <input type="text" placeholder="Enter city name...">
            <button>Search</button>
        </div>

        <div class="weather">

            <h2 class="city">Tehran</h2>

            <div class="weatherIcon">
                ☀️
            </div>

            <h1 class="temperature">28°C</h1>

            <p class="description">Sunny</p>

            <div class="details">

                <div class="detail">
                    <span>💧</span>
                    <p>Humidity</p>
                    <strong>35%</strong>
                </div>

                <div class="detail">
                    <span>💨</span>
                    <p>Wind</p>
                    <strong>12 km/h</strong>
                </div>

            </div>

        </div>

    </div>


    <script src="script.js"></script>


    <script src="script.js"></script>

</body>

</html>

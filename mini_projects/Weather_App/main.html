<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather App</title>
    <link rel="stylesheet" href="style.css">

</head>

<body>

    <div id="container">

        <div class="title">
            <h2>Weather App 🌦️</h2>
        </div>

        <div class="con">
            <input id="cityInput" type="text" placeholder="Enter city name...">
            <button id="searchBtn">Search</button>
        </div>

        <div class="weather">

            <h2 class="city" id="cityName">-</h2>

            <div class="weatherIcon" id="statusEmoji">
                🌍
            </div>

            <h1 class="temperature" id="temp">-°C</h1>

            <p class="description" id="status">-</p>

            <div class="details">

                <div class="detail">
                    <span>💧</span>
                    <p>Humidity</p>
                    <strong id="humidity">-%</strong>
                </div>

                <div class="detail">
                    <span>💨</span>
                    <p>Wind</p>
                    <strong id="wind">- km/h</strong>
                </div>

            </div>

        </div>

    </div>

    <script src="script.js"></script>

</body>

</html>
